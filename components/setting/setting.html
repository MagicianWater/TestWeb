<div class="card theme-accent">
    <h3>快捷键设置</h3>
    <div id="hotkeyList" class="hotkey-list"></div>
</div>
<div class="card theme-accent">
    <h3>样式设置</h3>
    <div class="toggle-row">
        <span class="toggle-label">标题遮挡</span>
        <label class="toggle-switch">
            <input type="checkbox" id="titleOverlayBtn">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <div class="toggle-row">
        <span class="toggle-label">小窗样式</span>
        <label class="toggle-switch">
            <input type="checkbox" id="miniViewBtn">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <div class="range-row">
        <span class="range-label">宽度阈值</span>
        <span class="range-value" id="miniViewWVal">450</span>
        <input type="range" id="miniViewWRange" class="range-slider" min="0" max="450" value="450">
    </div>
    <div class="range-row">
        <span class="range-label">高度阈值</span>
        <span class="range-value" id="miniViewHVal">450</span>
        <input type="range" id="miniViewHRange" class="range-slider" min="0" max="450" value="450">
    </div>
</div>
<div class="card theme-accent card-collapsible">
    <h3 class="card-toggle" data-target="sideLayoutCfg">快捷栏设置<span class="card-state">收起</span></h3>
    <div id="sideLayoutCfg" class="side-layout-cfg card-body"></div>
</div>
<div class="card theme-accent card-collapsible">
    <h3 class="card-toggle" data-target="widgetMgr">功能与脚本管理<span class="card-state">收起</span></h3>
    <div id="widgetMgr" class="widget-mgr card-body"></div>
</div>
<div class="card theme-accent">
    <h3>存档管理</h3>
    <p class="tip">导出当前进度为存档文件，或从存档文件恢复进度</p>
    <button id="exportSaveBtn" class="setting-btn">导出存档</button>
    <button id="importSaveBtn" class="setting-btn">载入存档</button>
    <p class="tip" id="saveStatusTip" style="min-height:18px;"></p>
</div>
