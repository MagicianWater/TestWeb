<!-- 未登录视图 -->
<div id="accountGuestView" class="account-view">
    <div class="card theme-pink">
        <h3>账号登录</h3>
        <p class="tip">登录后可使用聊天、市场等联机功能。没有账号？直接注册即可。</p>
        <div class="acct-form">
            <input type="email" id="acctEmail" class="acct-input" placeholder="邮箱地址" autocomplete="off">
            <input type="password" id="acctPassword" class="acct-input" placeholder="密码（至少6位）" autocomplete="off">
        </div>
        <div class="acct-actions">
            <button id="acctLoginBtn" class="acct-btn acct-btn-primary">登录</button>
            <button id="acctSignupBtn" class="acct-btn acct-btn-secondary">注册</button>
        </div>
        <p class="tip" id="acctMsg" style="min-height:18px;"></p>
    </div>
</div>

<!-- 已登录视图 -->
<div id="accountUserView" class="account-view" style="display:none;">
    <div class="card theme-pink">
        <h3>个人信息</h3>
        <div class="acct-info">
            <div class="acct-info-row">
                <span class="acct-info-label">邮箱</span>
                <span class="acct-info-value" id="acctUserEmail">—</span>
            </div>
            <div class="acct-info-row">
                <span class="acct-info-label">用户名</span>
                <span class="acct-info-value" id="acctUsername">—</span>
            </div>
            <div class="acct-info-row">
                <span class="acct-info-label">词元余额</span>
                <span class="acct-info-value" id="acctBalance">—</span>
            </div>
            <div class="acct-info-row">
                <span class="acct-info-label">注册时间</span>
                <span class="acct-info-value" id="acctCreatedAt">—</span>
            </div>
        </div>
    </div>
    <div class="card theme-pink">
        <h3>修改用户名</h3>
        <p class="tip">用户名将显示在聊天和市场</p>
        <div class="acct-form">
            <input type="text" id="acctNewName" class="acct-input" placeholder="输入新用户名" maxlength="16">
        </div>
        <div class="acct-actions">
            <button id="acctSaveNameBtn" class="acct-btn acct-btn-primary">保存</button>
        </div>
        <p class="tip" id="acctNameMsg" style="min-height:18px;"></p>
    </div>
    <div class="card theme-pink">
        <h3>账号操作</h3>
        <div class="acct-actions">
            <button id="acctLogoutBtn" class="acct-btn acct-btn-danger">退出登录</button>
        </div>
    </div>
</div>
